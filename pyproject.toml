[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screensaver"
version = "0.1.0"
description = "Lightweight portable screenshot tool – similar to Lightshot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    "pynput>=1.7.0",
]

[project.scripts]
screensaver = "screensaver.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
